<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220">
  <!-- DOTest hero art © Ahmed Al-Zahrani -->
  <style>
    .pin{animation:p 2.2s ease-in-out infinite}
    .tr{stroke-dasharray:6 14;animation:f 1.6s linear infinite}
    .core{animation:c 1.8s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes f{to{stroke-dashoffset:-40}}
    @keyframes c{0%,100%{opacity:.5}50%{opacity:1}}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <radialGradient id="cg" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#1b1f4a"/><stop offset="1" stop-color="#0a0c1f"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g stroke="url(#g)" stroke-width="2" fill="none" opacity=".7">
    <path class="tr" d="M10 60 H90 V80"/><path class="tr" d="M10 110 H88"/><path class="tr" d="M10 160 H90 V140"/>
    <path class="tr" d="M310 60 H230 V80"/><path class="tr" d="M310 110 H232"/><path class="tr" d="M310 160 H230 V140"/>
    <path class="tr" d="M130 10 V44"/><path class="tr" d="M190 10 V44"/><path class="tr" d="M130 210 V176"/><path class="tr" d="M190 210 V176"/>
  </g>
  <g fill="#00e5ff">
    <circle class="pin" cx="10" cy="60" r="4"/><circle class="pin" cx="10" cy="110" r="4" style="animation-delay:.4s"/><circle class="pin" cx="10" cy="160" r="4" style="animation-delay:.8s"/>
  </g>
  <g fill="#a855f7">
    <circle class="pin" cx="310" cy="60" r="4" style="animation-delay:.2s"/><circle class="pin" cx="310" cy="110" r="4" style="animation-delay:.6s"/><circle class="pin" cx="310" cy="160" r="4" style="animation-delay:1s"/>
  </g>
  <rect x="88" y="52" width="144" height="116" rx="16" fill="url(#cg)" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>
  <g fill="#7f88c9" opacity=".7">
    <rect x="100" y="44" width="6" height="8" rx="1"/><rect x="118" y="44" width="6" height="8" rx="1"/><rect x="136" y="44" width="6" height="8" rx="1"/><rect x="154" y="44" width="6" height="8" rx="1"/><rect x="172" y="44" width="6" height="8" rx="1"/><rect x="190" y="44" width="6" height="8" rx="1"/><rect x="208" y="44" width="6" height="8" rx="1"/>
    <rect x="100" y="168" width="6" height="8" rx="1"/><rect x="118" y="168" width="6" height="8" rx="1"/><rect x="136" y="168" width="6" height="8" rx="1"/><rect x="154" y="168" width="6" height="8" rx="1"/><rect x="172" y="168" width="6" height="8" rx="1"/><rect x="190" y="168" width="6" height="8" rx="1"/><rect x="208" y="168" width="6" height="8" rx="1"/>
  </g>
  <g transform="translate(128 64)">
    <path d="M32 4 L56 18 V46 L32 60 L8 46 V18 Z" fill="rgba(0,229,255,.06)" stroke="url(#g)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M23 19.5 h8 a12.5 12.5 0 0 1 0 25 h-8 z" fill="none" stroke="url(#g)" stroke-width="4.5" stroke-linejoin="round"/>
    <circle class="core" cx="31" cy="32" r="4.2" fill="#00e5ff"/>
    <path d="M44 10 l-4 9 h5 l-5 10" fill="none" stroke="#ff3d81" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="160" y="150" text-anchor="middle" font-family="Orbitron,monospace,sans-serif" font-weight="900" font-size="15" fill="#e9edff" letter-spacing="1">DOTest</text>
</svg>
